name: Photos problem
description: Report a Photos problem
title: "[Photos] "
labels: [bug, needs-triage, "area:gallery"]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Report one problem and remove private information from attachments.
  - type: dropdown
    id: lineage_version
    attributes:
      label: LineageOS version
      options:
        - "24.0 / Android 17"
        - "23.2 / Android 16"
        - "Other (give the version below)"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: ROM and app versions
      placeholder: "Native25; Photos alpha1 API37"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Device and setup
      description: Model, stock firmware/region, installed optional packages, and any root or system changes.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - A feature fails
        - Cannot boot or finish setup
        - Possible data loss
        - Minor visual problem
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Number the steps. Include frequency and the last working version, if known.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: Include the exact error and whether restarting helps.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots (optional)
      description: Remove accounts, IMEIs, credentials and private media. Keep partition backups private.
