name: Feature request
description: Suggest a device fix or optional improvement
title: "[Request] "
labels: [enhancement, needs-triage]
body:
  - type: dropdown
    id: lineage_version
    attributes:
      label: LineageOS version
      options:
        - "24.0 / Android17"
        - "23.2 / Android16"
        - "Other (give the exact version below)"
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Use case and desired result
      description: Explain who benefits and mention related issues or an existing workaround.
    validations:
      required: true
